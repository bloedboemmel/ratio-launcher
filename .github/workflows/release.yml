name: Production Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '.github/workflows/**'
      - 'docs/**'

jobs:
  release:
    runs-on: ubuntu-latest
    # Only run when a merge from beta lands on main, or when manually dispatched
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'beta') || contains(github.event.head_commit.message, 'Merge')
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Release AAB + APK
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: ./gradlew assembleRelease bundleRelease

      - name: Get version name
        id: version
        run: echo "name=$(grep versionName app/build.gradle.kts | head -1 | sed 's/.*\"\(.*\)\"/\1/')" >> $GITHUB_OUTPUT

      - name: Sign APK
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > release.keystore
          ${ANDROID_HOME}/build-tools/34.0.0/apksigner sign --ks release.keystore --ks-pass pass:"$STORE_PASSWORD" --ks-key-alias "$KEY_ALIAS" --key-pass pass:"$KEY_PASSWORD" --out app-release-signed.apk app/build/outputs/apk/release/*.apk

      - name: Sign AAB
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -keystore release.keystore -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" app/build/outputs/bundle/release/*.aab "$KEY_ALIAS"

      - name: Create Production GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: "Ratio Launcher v${{ steps.version.outputs.name }}"
          body: "Production release v${{ steps.version.outputs.name }}"
          prerelease: false
          make_latest: true
          files: |
            app-release-signed.apk
            app/build/outputs/bundle/release/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false

      - name: Install Fastlane
        run: gem install fastlane

      - name: Promote Internal release to Production
        env:
          PLAY_STORE_JSON: ${{ secrets.PLAY_STORE_JSON }}
        run: |
          echo "$PLAY_STORE_JSON" > play-store-key.json
          fastlane run supply \
            package_name:"com.bloedboemmel.ratio" \
            track:"internal" \
            track_promote_to:"production" \
            json_key:"play-store-key.json" \
            rollout:"1.0" \
            skip_upload_apk:true \
            skip_upload_aab:true \
            skip_upload_metadata:true \
            skip_upload_images:true \
            skip_upload_screenshots:true \
            skip_upload_changelogs:true
